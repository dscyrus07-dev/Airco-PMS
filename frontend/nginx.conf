# Management Tool — SPA + reverse proxy
# Serves the built SPA and proxies /api and /uploads to the API service.
# This container IS the public entrypoint — the API is not exposed directly.

map $http_x_request_id $request_id_header {
    ""      $request_id;              # mint one when the client didn't supply
    default $http_x_request_id;       # else propagate the client's id
}

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1k;

    client_max_body_size 12m;  # uploads are limited to 10 MB server-side

    # Security headers (the API sets its own for JSON responses)
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    location /healthz {
        access_log off;
        return 200 "ok";
    }

    location /api/ {
        proxy_pass http://api:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-ID $request_id_header;
        proxy_read_timeout 60s;
        proxy_connect_timeout 10s;
    }

    location /uploads/ {
        proxy_pass http://api:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # SPA fallback — client-side router owns everything else
    location / {
        try_files $uri $uri/ /index.html;
    }
}
